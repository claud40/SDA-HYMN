    <meta property="og:description" content="Official Kristu mu Nyimbo multilingual Seventh-day Adventist hymnal PWA with hymns in Bemba, Tonga, Chewa, and English, together with the English Bible and full offline worship support." />
    <meta property="og:type" content="website" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <script>
      (function() {
        try {
          var pref = localStorage.getItem('hymnal_theme_pref');
          var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            if (document.body) document.body.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            if (document.body) document.body.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F5] dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased selection:bg-amber-200 selection:text-amber-950 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
