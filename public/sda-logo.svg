<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <linearGradient id="sdaFlameGradLeft" x1="40" y1="180" x2="110" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="sdaFlameGradCenter" x1="100" y1="170" x2="120" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="sdaFlameGradRight" x1="200" y1="180" x2="130" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="sdaCrossGrad" x1="120" y1="50" x2="120" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
  </defs>

  <!-- Outer halo ring -->
  <circle cx="120" cy="120" r="110" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4" />

  <!-- Left Outer Flame -->
  <path d="M 52 165 C 44 140, 48 105, 68 78 C 84 56, 106 42, 115 32 C 108 52, 95 72, 85 92 C 75 112, 70 135, 76 155 C 67 160, 58 163, 52 165 Z" fill="url(#sdaFlameGradLeft)" opacity="0.95"/>
  <path d="M 76 155 C 72 135, 78 115, 88 96 C 96 80, 108 65, 116 52 C 112 68, 105 84, 98 100 C 90 120, 86 140, 90 156 Z" fill="#FEF08A" opacity="0.8"/>

  <!-- Right Outer Flame -->
  <path d="M 188 165 C 196 140, 192 105, 172 78 C 156 56, 134 42, 125 32 C 132 52, 145 72, 155 92 C 165 112, 170 135, 164 155 C 173 160, 182 163, 188 165 Z" fill="url(#sdaFlameGradRight)" opacity="0.95"/>
  <path d="M 164 155 C 168 135, 162 115, 152 96 C 144 80, 132 65, 124 52 C 128 68, 135 84, 142 100 C 150 120, 154 140, 150 156 Z" fill="#FBBF24" opacity="0.8"/>

  <!-- Center Rising Flame -->
  <path d="M 112 165 C 104 135, 106 100, 114 70 C 117 56, 119 40, 120 26 C 121 40, 123 56, 126 70 C 134 100, 136 135, 128 165 Z" fill="url(#sdaFlameGradCenter)"/>

  <!-- Cross -->
  <path d="M 116 58 L 124 58 L 124 168 L 116 168 Z" fill="url(#sdaCrossGrad)" stroke="#78350F" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M 98 88 L 142 88 L 142 96 L 98 96 Z" fill="url(#sdaCrossGrad)" stroke="#78350F" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="120" cy="92" r="2.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Open Bible Base -->
  <path d="M 50 178 C 80 168, 105 174, 120 182 L 120 196 C 105 188, 80 182, 50 192 Z" fill="#92400E" opacity="0.8"/>
  <path d="M 190 178 C 160 168, 135 174, 120 182 L 120 196 C 135 188, 160 182, 190 192 Z" fill="#78350F" opacity="0.8"/>
  <path d="M 52 172 C 82 162, 106 167, 120 176 L 120 189 C 106 180, 82 175, 52 185 Z" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
  <path d="M 188 172 C 158 162, 134 167, 120 176 L 120 189 C 134 180, 158 175, 188 185 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>

  <!-- Page Lines -->
  <line x1="66" y1="174" x2="108" y2="171" stroke="#D97706" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="66" y1="178" x2="108" y2="175" stroke="#D97706" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="132" y1="171" x2="174" y2="174" stroke="#D97706" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="132" y1="175" x2="174" y2="178" stroke="#D97706" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="120" y1="172" x2="120" y2="195" stroke="#78350F" stroke-width="2"/>
</svg>
